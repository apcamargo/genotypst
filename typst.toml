[package]
name = "genotypst"
version = "0.12.0"
entrypoint = "src/lib.typ"
authors = ["Antonio Camargo <https://github.com/apcamargo>"]
license = "MIT"
description = "genotypst: A package for bioinformatics data analysis and visualization."
repository = "https://github.com/apcamargo/genotypst"
keywords = [
  "bioinformatics",
  "fasta",
  "alignment",
  "protein",
  "dna",
  "rna",
  "genome",
  "phylogeny",
  "secondary-structure",
]
categories = ["visualization", "utility"]
exclude = ["/docs/", "/plugins/"]
