[package]
name = "rna-structure"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-minimal-protocol = "0.2.0"

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1
